<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisar registro de estudio</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 600px;">
        <div class="card p-4">
            <h1 class="h4">Revisa tu registro</h1>
            <p>Corrige los campos indicados para guardar tu avance.</p>

            <form method="post" action="{% url 'guardar_estudio' %}">
                {% csrf_token %}
                {{ formulario_estudio.as_p }}

                <button class="btn btn-primary" type="submit">
                    Guardar
                </button>
                <a class="btn btn-outline-secondary"
                   href="{% url 'usuario' %}">
                    Volver
                </a>
            </form>
        </div>
    </main>
</body>
</html>
